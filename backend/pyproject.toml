[project]
name = "backend"
version = "0.1.0"
description = "Backend for the Orbital Radio, a project playing music from regions satellites pass over"
authors = [
    {name = "DominicL3", email = "leducd98@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.13,<0.116.0",
    "uvicorn>=0.34.3,<0.35.0",
    "spotipy>=2.25.1,<3.0.0",
    "requests>=2.32.4,<3.0.0",
    "apscheduler>=3.11.0,<4.0.0",
    "httpx>=0.28.1,<0.29.0",
    "shapely>=2.0.0,<3.0.0",
    "geopandas>=1.0.0,<2.0.0",
    "pytest>=8.4.1,<9.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.12.0,<0.13.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
]
